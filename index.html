<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TablePlan • Meal planner</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5ef;color:#20372f;font:16px system-ui}main{max-width:1050px;margin:auto;padding:40px 20px}h1{font-size:44px;margin:6px 0}p{line-height:1.6}.eyebrow{color:#5b7668;letter-spacing:3px;font-size:12px}form,.card{background:white;padding:24px;border-radius:18px;margin:20px 0;border:1px solid #dce4dc}.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}label{display:block;font-weight:600;font-size:14px}input,select,button{width:100%;padding:12px;margin-top:8px;border-radius:9px;border:1px solid #b5c6ba;font:inherit}button{background:#245940;color:white;cursor:pointer;border:0}button:disabled{opacity:.6;cursor:wait}.notice{padding:15px;background:#fff0cc;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid .card{margin:0}li{padding:5px 0}h2{margin-top:28px}h3{margin-top:0}.error{color:#a32020}details{margin:16px 0}summary{cursor:pointer;font-weight:600}small{color:#576c60}.check{font-weight:400;display:flex;gap:10px;padding:6px 0}.check input{width:auto;margin:0} @media(max-width:720px){.fields,.grid{grid-template-columns:1fr}h1{font-size:34px}}@media print{form,.print{display:none}body{background:white}.card{break-inside:avoid}}
</style><main><div class="eyebrow">TABLEPLAN</div><h1>Good meals. A simple plan.</h1><p>Choose your recipe style, set your table size, and plan your dinners.</p><form id="planner"><div class="fields"><label>1. Recipe type<select name="category"><option>Keto</option><option>Vegan</option><option>High Protein</option><option>Affordable</option></select></label><label>2. People<input name="people" type="number" min="1" max="20" value="2" required></label><label>3. Days<input name="days" type="number" min="1" max="31" value="7" required></label><label>4. ZIP code or address<input name="location" placeholder="e.g. 30101" maxlength="200" required></label></div><p><small>Plans include one dinner per day. Recipes rotate through a small starter collection. Affordable recipes use pantry staples; local prices determine actual cost.</small></p><button id="build">Build my meal plan</button></form><div id="status" role="status" aria-live="polite"></div><section id="results"></section></main>
<script>
const el=(tag,text,parent)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(parent)parent.append(n);return n};
const quantity=i=>`${i.quantity} ${i.unit} ${i.name}`;
document.querySelector('#planner').addEventListener('submit',async e=>{e.preventDefault();const button=document.querySelector('#build'),status=document.querySelector('#status'),root=document.querySelector('#results');button.disabled=true;status.className='';status.textContent='Building your plan…';root.replaceChildren();try{const f=new FormData(e.target);const res=await fetch('/api/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({category:f.get('category'),people:Number(f.get('people')),days:Number(f.get('days')),location:f.get('location')})});const p=await res.json();if(!res.ok)throw Error(p.error);status.textContent=p.notice;status.className='notice';el('h2',`${p.days} dinners for ${p.people} people`,root);const print=el('button','Print plan & shopping list',root);print.className='print';print.onclick=()=>window.print();el('h2','Combined shopping list',root);el('p','Quantities are amounts used in recipes. Round up to package sizes; canned bean weights are drained weights.',root);const list=el('div',undefined,root);list.className='card';p.shopping.forEach(i=>{const label=el('label',undefined,list);label.className='check';const checkbox=el('input',undefined,label);checkbox.type='checkbox';el('span',quantity(i),label)});el('h2',p.mode==='demo'?'Three example stores':'Closest grocery stores returned by provider',root);const grid=el('div',undefined,root);grid.className='grid';if(!p.stores.length)el('p','No stores found for this location.',grid);p.stores.forEach(s=>{const c=el('article',undefined,grid);c.className='card';el('h3',s.name,c);if(s.distanceKm!==undefined)el('p',`${s.distanceKm} km away`,c);if(s.address)el('p',s.address,c);if(s.checkedAt)el('small',`Checked: ${s.checkedAt}`,c);const ul=el('ul',undefined,c);s.items.forEach(i=>el('li',`${i.name}: ${i.availability||'Not verified'}${typeof i.price==='number'?` • ${i.price} ${i.currency||''} per package`:''}`,ul));});el('h2','Recipes & directions',root);p.meals.forEach(m=>{const c=el('article',undefined,root);c.className='card';el('small',`DAY ${m.day}`,c);el('h3',m.name,c);const ul=el('ul',undefined,c);m.ingredients.forEach(i=>el('li',quantity(i),ul));const ol=el('ol',undefined,c);m.steps.forEach(step=>el('li',step,ol))});}catch(err){status.className='error';status.textContent=err.message||'Unable to build plan.'}finally{button.disabled=false}});
</script></html>
